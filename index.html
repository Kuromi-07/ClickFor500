<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Click for ₱500</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      --ink: #152238;
      --green: #159957;
      --green-dark: #087f45;
      --cream: #fff8e8;
      --coral: #ff7b67;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      background: linear-gradient(145deg, var(--cream), #dff5e7 55%, #bce7dc);
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .game {
      width: min(100%, 540px);
      min-height: min(680px, 88svh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      border: 3px solid rgba(21, 34, 56, .12);
      border-radius: 28px;
      background: rgba(255, 255, 255, .62);
      box-shadow: 0 24px 60px rgba(21, 34, 56, .16);
      overflow: hidden;
    }

    .game::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: var(--coral);
      opacity: .18;
      top: -80px;
      right: -60px;
    }

    h1 {
      margin: 0 20px 12px;
      font-size: clamp(2.2rem, 10vw, 4.4rem);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 0 20px 32px;
      font-size: 1.05rem;
      opacity: .72;
    }

    .button-zone {
      position: relative;
      width: min(88%, 420px);
      height: 220px;
      touch-action: none;
    }

    button {
      position: absolute;
      width: 178px;
      height: 58px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font: 800 1rem "Trebuchet MS", sans-serif;
      letter-spacing: .06em;
      box-shadow: 0 8px 0 var(--green-dark), 0 14px 24px rgba(8, 127, 69, .24);
      cursor: pointer;
      transition: left .12s ease-out, top .12s ease-out, transform .08s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--green-dark); }

    .hint {
      margin-top: 24px;
      font-size: .78rem;
      opacity: .45;
    }

    @media (max-height: 620px) {
      .game { min-height: 94svh; }
      .button-zone { height: 160px; }
      p { margin-bottom: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="game" aria-label="Click for five hundred pesos game">
      <h1>Click for ₱500</h1>
      <p>One easy tap. What could go wrong?</p>
      <div class="button-zone" id="zone">
        <button id="claim" type="button">CLAIM NOW</button>
      </div>
      <div class="hint">Try to catch it.</div>
    </section>
  </main>

  <script>
    const zone = document.querySelector('#zone');
    const claim = document.querySelector('#claim');
    let clickCount = 0;

    function moveButton(event) {
      if (event) event.preventDefault();

      const maxX = Math.max(0, zone.clientWidth - claim.offsetWidth);
      const maxY = Math.max(0, zone.clientHeight - claim.offsetHeight);
      const currentX = claim.offsetLeft;
      const currentY = claim.offsetTop;
      let nextX = currentX;
      let nextY = currentY;

      for (let attempt = 0; attempt < 20; attempt++) {
        nextX = Math.floor(Math.random() * (maxX + 1));
        nextY = Math.floor(Math.random() * (maxY + 1));
        if (Math.abs(nextX - currentX) + Math.abs(nextY - currentY) > 90) break;
      }

      claim.style.left = `${nextX}px`;
      claim.style.top = `${nextY}px`;
    }

    function centerButton() {
      claim.style.left = `${Math.max(0, (zone.clientWidth - claim.offsetWidth) / 2)}px`;
      claim.style.top = `${Math.max(0, (zone.clientHeight - claim.offsetHeight) / 2)}px`;
    }

    zone.addEventListener('pointermove', (event) => {
      const buttonBox = claim.getBoundingClientRect();
      const distanceX = Math.max(buttonBox.left - event.clientX, event.clientX - buttonBox.right, 0);
      const distanceY = Math.max(buttonBox.top - event.clientY, event.clientY - buttonBox.bottom, 0);
      if (Math.hypot(distanceX, distanceY) < 74) moveButton(event);
    });

    claim.addEventListener('pointerenter', moveButton);
    claim.addEventListener('pointerdown', moveButton);
    claim.addEventListener('click', () => {
      clickCount++;
      window.alert("IT'S A PRANK! UTO-UTO!");
    });
    window.addEventListener('resize', centerButton);
    centerButton();
  </script>
</body>
</html>
